name: Feature Request
description: Suggest an idea or improvement for TerraBuilder
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide as much context as possible.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the problem you're experiencing.
      placeholder: I'm always frustrated when...

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any alternative solutions or features you've thought about.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of TerraBuilder does this relate to?
      options:
        - Canvas / UI
        - Resource Schemas (AWS)
        - Resource Schemas (Azure)
        - Resource Schemas (GCP)
        - Terraform Emitter
        - CloudFormation Emitter
        - Bicep Emitter
        - New Emitter
        - Security Analysis
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, mockups, or screenshots about the feature request.
